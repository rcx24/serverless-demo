[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "serverless-demo"
version = "0.1.0"
description = "Seeds and tears down the Serverless AI security demo in a dedicated AWS account."
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.35",
    "jsonschema>=4.21",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "moto>=5.0"]

[project.scripts]
serverless-demo = "serverless_demo.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/serverless_demo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
